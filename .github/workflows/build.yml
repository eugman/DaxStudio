name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.config', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore NuGet packages
        run: nuget restore src/DaxStudio.sln

      - name: Build Standalone
        run: msbuild src/DaxStudio.Standalone/DaxStudio.Standalone.csproj -p:Configuration=Debug -m -verbosity:minimal

      - name: Build Tests
        run: msbuild tests/DaxStudio.Tests/DaxStudio.Tests.csproj -p:Configuration=Debug -m -verbosity:minimal

      - name: Run tests
        run: |
          # Exclude tests that require SSAS or have environment-specific dependencies
          $filter = "FullyQualifiedName!~TestModelName&FullyQualifiedName!~TestTables&FullyQualifiedName!~TestColumns&FullyQualifiedName!~TestMeasures&FullyQualifiedName!~SystemRuntimeComplierServicesUnsafeCheck&FullyQualifiedName!~SystemMemoryCheck"
          & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe" src/bin/Debug/DaxStudio.Tests.dll --TestCaseFilter:"$filter" --logger:trx
        shell: pwsh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DaxStudio-Debug
          path: src/bin/Debug/
          retention-days: 14
